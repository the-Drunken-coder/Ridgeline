# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  pre_merge_checks:
    docstrings:
      mode: "off"
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - CODE_CONVENTIONS.md
      - docs/conventions/lifecycle.md
      - docs/conventions/rendering.md
      - docs/conventions/interactions.md
      - docs/conventions/testing.md
      - docs/agents/review.md
      - docs/agents/entity-review.md
