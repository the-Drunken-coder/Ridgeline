name: Validation

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  module-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-fixture-failures
          path: .artifacts/validation/
          include-hidden-files: true
          if-no-files-found: ignore

  consumer-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:playground && pnpm build:controls

  packaged-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run installed consumer cases
        run: pnpm test:browser --shard=${{ matrix.shard }}/4 --reporter=list,blob,json
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/packaged-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-packaged-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-packaged-${{ matrix.shard }}
          path: reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failures-packaged-${{ matrix.shard }}
          path: .artifacts/playwright/
          include-hidden-files: true
          if-no-files-found: warn

  control-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:controls:browser --reporter=list,blob
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-control
          path: blob-report/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failures-control
          path: control-lab/test-results/
          if-no-files-found: warn

  browser-reports:
    if: ${{ !cancelled() }}
    needs: [packaged-browser, control-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: blob-report
          merge-multiple: true
      - name: Combine available browser reports
        if: always()
        run: pnpm exec playwright merge-reports --config scripts/playwright-merge.config.mjs blob-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: .artifacts/browser-report/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: results-packaged-*
          path: reports
          merge-multiple: true
      - name: Verify every packaged case executed exactly once
        if: always()
        run: |
          pnpm exec playwright test --config playwright.packaged.config.mjs --list --reporter=json > discovery.json
          node scripts/check-shards.mjs discovery.json reports/packaged-{1,2,3,4}.json

  validate:
    # A skipped required job permits merging. Always evaluate the short gate,
    # including cancelled prerequisites, instead of skipping it on cancellation.
    if: always()
    needs: [typecheck, module-tests, packaged-browser, control-browser, consumer-builds, browser-reports]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/check-validation.mjs
        env:
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
