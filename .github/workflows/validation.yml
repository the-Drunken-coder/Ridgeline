name: PR 122 date-line diagnostics

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  date-line-diagnostics:
    name: Original c747d78 instrumented experiment
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/browser-resources.mjs packaged --preflight
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Ten independent focused runs, then original shard 2 of 4
        run: |
          mkdir -p .artifacts/date-line-diagnostics
          node scripts/ci/date-line-diagnostics.mjs 2>&1 | tee .artifacts/date-line-diagnostics/job.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr122-date-line-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/date-line-diagnostics/
            .artifacts/playwright/
            .artifacts/browser-runs/
            .artifacts/browser-run.lock/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
