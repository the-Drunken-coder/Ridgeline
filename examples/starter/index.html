<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ridgeline starter</title>
<style>
:root{font:13px/1.4 system-ui,sans-serif;color:#243a31;background:#fafbf7;--line:#c7d2c8}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit}button,select{padding:7px 9px;border:1px solid var(--line);background:#fff;border-radius:2px}header{padding:12px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}header strong{font-size:16px}#status{margin-left:auto}#workspace{display:grid;grid-template-columns:220px minmax(0,1fr);height:calc(100dvh - 50px);min-height:500px}aside{padding:16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px;overflow:auto}h2,p{margin:0}h2{font-size:13px}label{display:flex;flex-direction:column;gap:5px}#map{position:relative;min-width:0;height:100%}#selection{overflow-wrap:anywhere}.actions{display:flex;gap:6px;flex-wrap:wrap}#drawing-tools,#drawing-inspector{display:none}body[data-mode=drawing] #workspace{grid-template-columns:100px minmax(0,1fr) 244px;grid-template-rows:auto minmax(0,1fr)}body[data-mode=drawing] aside{grid-column:1/-1;grid-row:1;flex-direction:row;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center}body[data-mode=drawing] aside>section{display:none}body[data-mode=drawing] aside>#storage{display:block}#storage{display:none}#storage label{flex-direction:row;align-items:center}body[data-mode=drawing] aside>label{flex-direction:row;align-items:center}body[data-mode=drawing] #drawing-tools{display:block;grid-column:1;grid-row:2;min-height:0}body[data-mode=drawing] #map{grid-column:2;grid-row:2}body[data-mode=drawing] #drawing-inspector{display:block;grid-column:3;grid-row:2;min-height:0}[hidden]{display:none!important}@media(max-width:600px){#workspace{display:flex;flex-direction:column;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}#map{height:440px;flex:none}body[data-mode=drawing] aside{flex-wrap:wrap}body[data-mode=drawing] .rl-drawing-tools{flex-direction:row;flex-wrap:wrap}body[data-mode=drawing] #drawing-inspector{max-height:600px}}@media(prefers-color-scheme:dark){:root{color:#eff3ed;background:#222a25;--line:#4b584e}button,select{background:#19231c}}
</style></head>
<body data-mode="selection"><header><strong>Ridgeline</strong><span>Starter</span><span id="status" role="status">Loading</span></header>
<div id="workspace"><aside><label>Example<select id="example"><option value="selection">Selection and styling</option><option value="drawing">Drawing and storage</option></select></label>
<section><h2>Selection</h2><p id="selection">No feature selected</p><div class="actions"><button id="clear-selection">Clear selection</button></div></section>
<section id="help"><p>Shift-click toggles selection. Alt-drag selects a rectangle. Shift-drag keeps native box zoom.</p></section>
<section id="storage"><label><input id="reject-save" type="checkbox">Reject next save</label><p id="storage-status" role="status"></p><button id="clear-saved" hidden>Clear unreadable saved drawings</button></section><button id="reset">Reset example</button></aside><div id="drawing-tools"></div><div id="map" aria-label="Interactive map"></div><div id="drawing-inspector"></div></div>
<script type="module" src="./main.ts"></script></body></html>
