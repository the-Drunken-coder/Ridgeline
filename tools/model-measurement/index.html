<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ridgeline model measurement</title>
<style>body{font:14px system-ui;margin:16px;color:#172b35}#map{width:1280px;height:720px}form{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;max-width:1280px}input{width:160px}pre{white-space:pre-wrap}button,input,select{font:inherit;padding:5px}h1{font-size:20px}</style>
<h1>Model measurement</h1><p>Runs the installed package. Save the raw report and review the screenshots. Smoke runs do not establish browser support or hardware performance.</p>
<form id="controls"><select name="case" aria-label="Workload"></select><select name="mode" aria-label="Run mode"><option value="smoke">Tooling smoke</option><option value="hardware">Hardware: 3 × 30 s per camera mode</option></select>
<input name="device" placeholder="Machine / device"><input name="os" placeholder="OS and version"><input name="gpu" placeholder="GPU"><input name="driver" placeholder="Driver / backend"><input name="browser" placeholder="Browser and version"><input name="hz" type="number" value="60" aria-label="Display refresh Hz"><button>Run off/on pair and save</button></form>
<pre id="status">Ready. Keep the tab foregrounded and the full canvas visible.</pre><div id="map"></div><script type="module" src="/consumer.ts"></script></html>
